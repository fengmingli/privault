name: Windows verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/windows.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-windows.ps1"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Use stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Install Windows crypto build tools
        shell: pwsh
        run: |
          choco install nasm strawberryperl -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci --registry=https://registry.npmjs.org

      - name: Verify and build Windows installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./scripts/verify-windows.ps1 -BuildInstaller

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Privault-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
